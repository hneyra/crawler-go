# backend ci. go checks + image builds (no push) + infra verify.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: crawler
          POSTGRES_PASSWORD: crawler-ci-only
          POSTGRES_DB: crawler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crawler -d crawler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # admin url. dbtest creates + drops one db per test.
      CRAWLER_TEST_DATABASE_URL: postgres://crawler:crawler-ci-only@127.0.0.1:5432/crawler?sslmode=disable
      # CI set -> integration tests fail instead of skip when db missing.
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: generated code up to date
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then git status --porcelain; git diff; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: test
        run: go test -race -count=1 ./...

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: VERSION=${{ github.sha }}
          tags: crawler-go:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: test "$(docker run --rm crawler-go:ci version)" = "${{ github.sha }}"
      - name: build worker image (chromium)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: worker
          build-args: VERSION=${{ github.sha }}
          tags: crawler-go-worker:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke worker (binary + chromium renders a page as non-root, read-only rootfs)
        run: |
          test "$(docker run --rm crawler-go-worker:ci version)" = "${{ github.sha }}"
          docker run --rm --read-only --tmpfs /tmp --tmpfs /data:uid=65532 --shm-size 256m --user 65532:65532 \
            --entrypoint /usr/bin/chromium crawler-go-worker:ci \
            --headless --no-sandbox --disable-gpu --dump-dom 'data:text/html,<h1>ok-crawler</h1>' | grep -q ok-crawler

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # node 26 ships no corepack. pin yarn classic.
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn verify
