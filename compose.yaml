# local dev stack. NOT the k3s deployment.
# app env: ${CRAWLER_ENV_FILE:-.env} (copy .env.example). never commit .env.
# compose-level overrides below win over env file (in-network db, bind addrs).
name: crawler

x-backend: &backend
  image: crawler-go:dev
  build:
    context: .
    dockerfile: deploy/Dockerfile
    args:
      VERSION: ${CRAWLER_VERSION:-dev}
  env_file:
    - path: ${CRAWLER_ENV_FILE:-.env}
      required: false
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-backend-env: &backend-env
  CRAWLER_DATABASE_URL: postgres://crawler:${CRAWLER_DB_PASSWORD:-crawler-dev-only}@db:5432/crawler?sslmode=disable
  # browser origin of the web ui (csrf origin check).
  CRAWLER_PUBLIC_URL: ${CRAWLER_WEB_ORIGIN:-http://localhost:3000}
  # read-only rootfs: snapshots go to the writable volume below.
  CRAWLER_RAW_DATA_DIR: /data/raw

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: ${CRAWLER_DB_PASSWORD:-crawler-dev-only}
      POSTGRES_DB: crawler
    ports:
      - "127.0.0.1:${CRAWLER_DB_PORT:-5441}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 5s
      timeout: 3s
      retries: 20

  # one-shot. api waits for exit 0.
  migrate:
    <<: *backend
    command: ["migrate", "up"]
    environment:
      <<: *backend-env
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["serve"]
    environment:
      <<: *backend-env
      CRAWLER_HTTP_ADDR: 0.0.0.0:8080
      CRAWLER_METRICS_ADDR: 0.0.0.0:9091
    volumes:
      - raw-data:/data
    ports:
      - "127.0.0.1:${CRAWLER_API_PORT:-8080}:8080"
      - "127.0.0.1:${CRAWLER_METRICS_PORT:-9091}:9091"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # job runner: crawl runs + periodic maintenance. chrome (headless) needed only for
  # blocked/js sites; this image has none -> see M7 headless image.
  worker:
    <<: *backend
    command: ["worker"]
    environment:
      <<: *backend-env
      CRAWLER_WORKER_HEALTH_ADDR: 127.0.0.1:8081
    volumes:
      - raw-data:/data
    healthcheck:
      test: ["CMD", "/crawler", "healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 4s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  # admin ui. `docker compose --profile full up` (or make up-full).
  # changing CRAWLER_WEB_PORT? set CRAWLER_WEB_ORIGIN to the same origin (csrf origin check).
  web:
    profiles: [full]
    image: crawler-web:dev
    build:
      context: web
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      API_INTERNAL_URL: http://api:8080
      ORIGIN: ${CRAWLER_WEB_ORIGIN:-http://localhost:3000}
      PUBLIC_ORIGIN: ${CRAWLER_WEB_ORIGIN:-http://localhost:3000}
      # direct hit, no proxy in front: use socket address.
      ADDRESS_HEADER: ""
    ports:
      - "127.0.0.1:${CRAWLER_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  raw-data:
